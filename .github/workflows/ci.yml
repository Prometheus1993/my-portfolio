name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-verify:
    name: Build & guardrail gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Fast, deterministic gates — no browser needed.
      - name: WCAG contrast gate
        run: npm run test:contrast
      - name: AI prompt-injection guard evals
        run: npm run test:ai-guard
      - name: Production build (type-checks the whole app)
        run: npm run build

  accessibility:
    name: A11y & Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start server
        run: |
          npm run start &
          npx --yes wait-on http://localhost:3000 --timeout 60000
      - name: pa11y (WCAG2AA, fails on contrast/a11y violations)
        run: npx --yes pa11y-ci
      # pa11y above is the hard WCAG gate. Lighthouse runs for score visibility
      # but does not block: its perf/scores are environment-sensitive in CI.
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          configPath: ./lighthouserc.json
